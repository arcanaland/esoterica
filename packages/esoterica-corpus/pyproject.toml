[project]
name = "esoterica-corpus"
version = "0.1.0"
description = "The build pipeline that turns a verbatim input into an esoterica source file"
requires-python = ">=3.14"
dependencies = ["esoterica-spec", "pydantic>=2.11", "typer>=0.16"]

[project.scripts]
esoterica = "esoterica_corpus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esoterica_corpus"]
