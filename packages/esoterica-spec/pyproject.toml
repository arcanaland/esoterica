[project]
name = "esoterica-spec"
version = "0.1.0"
description = "A shallow, dependency-free validator for the Tarot Esoterica Specification"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
esoterica-validate = "esoterica_spec.validate:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esoterica_spec"]
