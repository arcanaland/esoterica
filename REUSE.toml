version = 1
SPDX-PackageName = "arcanaland-esoterica"
SPDX-PackageSupplier = "Adam Fidel <adam@fidel.cloud>"
SPDX-PackageDownloadLocation = "https://github.com/arcanaland/esoterica"

# Fallback
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Adam Fidel"
SPDX-License-Identifier = "CC0-1.0"

# Code
[[annotations]]
path = ["justfile", "tools/**", "sources/*/build.py"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Adam Fidel"
SPDX-License-Identifier = "MIT"

# Third-party
[[annotations]]
path = "sources/mcelroy/input/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2014 Mark McElroy"
SPDX-License-Identifier = "LicenseRef-McElroy-Uncopyright"

# Derived work
[[annotations]]
path = "sources/mcelroy/dist/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2014 Mark McElroy"
SPDX-License-Identifier = "LicenseRef-McElroy-Uncopyright"

# The mapping is not the text. mapping.toml and drops.toml say where a label
# goes and why a line was left out; they quote no passage. PROVENANCE.toml is a
# build record and sits inside dist/, so it is carved back out of the entry
# above rather than inheriting the input's terms.
[[annotations]]
path = [
  "sources/*/mapping.toml",
  "sources/*/drops.toml",
  "sources/*/dist/PROVENANCE.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Adam Fidel"
SPDX-License-Identifier = "CC0-1.0"
