[project]
name = "esoterica-workspace"
version = "0"
requires-python = ">=3.14"
dependencies = ["esoterica-spec"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
esoterica-spec = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
# Inferred from requires-python, and the PEP 723 headers on build.py and
# tools/*.py declare the same, so every gate runs one Python.

[tool.ruff.lint]
extend-select = ["E", "I", "UP", "B", "C4", "SIM"]
