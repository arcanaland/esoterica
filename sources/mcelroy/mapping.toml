meaning = "cross"
value = 400

# ---------------------------------------------------------------------------
# "Planetary/Astrological/Elemental:" -- 22 rows
# ---------------------------------------------------------------------------
# A three-way disjunctive heading. Its 22 values are variously an element, a
# planet, a sign, a compound of two of those, or an alternation between two.
# Each is routed by hand into 6.2's `element`, `planet` and `zodiac`. Where the
# source alternates ("Leo or Libra") the alternation is kept in one string,
# because 6.1 says a correspondence value is in the source's own vocabulary and
# splitting it would assert a choice the book declines to make.

[correspondences.planetary."major_arcana.00"]           # Air
element = "air"

[correspondences.planetary."major_arcana.01"]           # The sun/Mercury
planet = "the sun/mercury"

[correspondences.planetary."major_arcana.02"]           # The moon
planet = "the moon"

[correspondences.planetary."major_arcana.03"]           # Venus
planet = "venus"

[correspondences.planetary."major_arcana.04"]           # Mars/Aries
planet = "mars"
zodiac = "aries"

[correspondences.planetary."major_arcana.05"]           # Taurus/Earth
zodiac = "taurus"
element = "earth"

[correspondences.planetary."major_arcana.06"]           # Gemini
zodiac = "gemini"

[correspondences.planetary."major_arcana.07"]           # Cancer
zodiac = "cancer"

[correspondences.planetary."major_arcana.08"]           # Leo or Libra
zodiac = "leo or libra"

[correspondences.planetary."major_arcana.09"]           # Virgo
zodiac = "virgo"

[correspondences.planetary."major_arcana.10"]           # Jupiter
planet = "jupiter"

[correspondences.planetary."major_arcana.11"]           # Libra or Leo
zodiac = "libra or leo"

[correspondences.planetary."major_arcana.12"]           # Water
