[correspondences.planetary."major_arcana.18"]           # Pisces
zodiac = "pisces"

[correspondences.planetary."major_arcana.19"]           # The sun
planet = "the sun"

[correspondences.planetary."major_arcana.20"]           # Fire
element = "fire"

[correspondences.planetary."major_arcana.21"]           # Saturn
planet = "saturn"

# ---------------------------------------------------------------------------
# Front matter that is content rather than apparatus
# ---------------------------------------------------------------------------
# Five chapters of the book describe groups of cards rather than any one card,
# and ESOTERICA.md 4.4's builtin families name exactly those groups. Each entry
# below claims a line range; drops.toml claims everything else.

[[front_matter]]
lines = "180-181"
target = "group.arcana.major"
key = "passages.text"
note = "The Major Arcana chapter, less its heading and its In This Chapter list."

[[front_matter]]
lines = "908"
target = "group.arcana.minor"
key = "passages.text"
note = "The Minor Arcana chapter."

[[front_matter]]
lines = "910-911"
target = "group.arcana.minor"
key = "passages.x_suit_cards"
note = "The Suit Cards, a subsection about the four suits collectively. No builtin family names the suits as a set, and 5.2 registers no key for it."

[[front_matter]]
lines = "929-933"
target = "group.classes.pip"
key = "passages.text"
note = "The Pip Cards chapter."

[[front_matter]]
lines = "935-966"
target = "group.classes.court"
key = "passages.text"
note = "The Court Cards chapter. Its bulleted tables are carried as the lines they are."

[[front_matter]]
lines = "914"
target = "group.suits.wands"
key = "passages.theme"
strip_prefix = "Dimension of Life: "

[[front_matter]]
lines = "918"
target = "group.suits.cups"
key = "passages.theme"
strip_prefix = "Dimension of Life: "

[[front_matter]]
lines = "922"
target = "group.suits.swords"
key = "passages.theme"
strip_prefix = "Dimension of Life: "

[[front_matter]]
lines = "926"
target = "group.suits.pentacles"
key = "passages.theme"
strip_prefix = "Dimension of Life: "

# ---------------------------------------------------------------------------
# Suit correspondences
# ---------------------------------------------------------------------------
# Each suit's "Other Associations:" line is one English sentence naming, in
# order, a season, a colour, a compass direction and an element. There are four
# such lines in the book, so the sixteen values are written here as data rather
# than recovered by parsing English.
#
# Coins reads "The color green or brown", an alternation. It is kept as one
# string for the same reason the planetary alternations are: `color` admits an
# array, but an array would say both apply, and the book says either.

[[group_correspondences]]
target = "group.suits.wands"
lines = "915"
values = { season = "spring", color = "red", direction = "south", element = "fire" }

[[group_correspondences]]
target = "group.suits.cups"
lines = "919"
values = { season = "summer", color = "blue", direction = "east", element = "water" }

[[group_correspondences]]
target = "group.suits.swords"
lines = "923"
values = { season = "fall", color = "yellow", direction = "west", element = "air" }

[[group_correspondences]]
target = "group.suits.pentacles"
lines = "927"
values = { season = "winter", color = "green or brown", direction = "north", element = "earth" }

# ---------------------------------------------------------------------------
# [meta]
# ---------------------------------------------------------------------------
# Values not drawn from SOURCE.toml. See TASK-003 in the knowledge base for why
# copyright, description and rights_status are omitted rather than guessed.

[meta]
schema_version = "1.0"
type = "book"
published_date = "2014-08"
default_language = "en"
redistribution = "full"
derivation = "full"

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------

[output]
filename = "mcelroy-a-guide-to-tarot-card-meanings-2014.toml"

# Key order in the built file. Keys absent from a given target are skipped;
# a key produced by the build and missing from these lists is a build failure,
# so adding a mapping above without ordering it here cannot slip through.
passage_order = [
  "text",
  "theme",
  "x_suit_cards",
  "x_note",
  "keywords",
  "light",
  "shadow",
  "personality",
  "affirmation",
  "story",
  "x_mythical_spiritual",
  "questions",
  "advice",
  "symbols",
]
advice_order = [
  "relationships",
  "work",
  "spirituality",
  "personal_growth",
  "fortune_telling",
  "timing",
]
correspondence_order = [
  "number",
  "archetype",
  "element",
  "planet",
  "zodiac",
  "astrology",
  "season",
  "color",
  "direction",
  "hebrew_letter",
  "hebrew_letter_meaning",
  "hebrew_letter_value",
  "x_hebrew_letter_alt",
  "x_numerology",
  "x_elemental_dignity",
]
group_order = [
  "group.arcana.major",
  "group.arcana.minor",
  "group.classes.pip",
  "group.classes.court",
  "group.suits.wands",
  "group.suits.cups",
