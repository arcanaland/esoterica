value = 80

[correspondences.hebrew."major_arcana.17"]
letter = "tzaddi"
meaning = "fishhook"
value = 90
alt = "hé/window/5"

[correspondences.hebrew."major_arcana.18"]
letter = "koph"
meaning = "back of the head"
value = 100

[correspondences.hebrew."major_arcana.19"]
letter = "resh"
